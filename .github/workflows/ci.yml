# ══════════════════════════════════════════════════════════════════════════════
# aSpiral - GitHub Actions CI
# Purpose: Fast PR feedback (web build, lint, typecheck) — Mobile builds via Codemagic
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-tests:
    name: Deno Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.3.0
      - run: |
          if [[ -f "supabase/functions/spiral-ai/aspiralMindcoreLoader.test.ts" ]]; then
            deno test supabase/functions/spiral-ai/aspiralMindcoreLoader.test.ts --allow-read --allow-env --lock=deno.lock
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Web Build + Lint + Typecheck + Tests + Security Audit
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.3.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit
        run: npm run security:audit

      - name: Test (aSpiral MindCore prompt loader)
        run: deno test supabase/functions/spiral-ai/aspiralMindcoreLoader.test.ts --allow-read --allow-env

      - name: Drift scan (legacy prompt ban + SHA lock)
        run: ./scripts/check-aspiral-prompt-drift.sh

      - name: Build (production)
        run: npm run build:production

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Capacitor Sync Check (validates mobile configs without full build)
  # ─────────────────────────────────────────────────────────────────────────────
  capacitor-check:
    name: Capacitor Sync Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.3.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/

      - name: Capacitor doctor
        run: npx --no @capacitor/cli@8.0.0 doctor || true

      - name: Validate capacitor.config.ts
        run: |
          if [[ -f "capacitor.config.ts" ]]; then
            echo "✅ capacitor.config.ts found"
            npx --no typescript@5.8.3 --noEmit capacitor.config.ts 2>/dev/null || echo "⚠️ Config validation skipped"
          else
            echo "⚠️ capacitor.config.ts not found"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS Export Compliance Check
  # ─────────────────────────────────────────────────────────────────────────────
  ios-compliance-check:
    name: iOS Export Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check ITSAppUsesNonExemptEncryption
        run: |
          PLIST="ios/App/App/Info.plist"
          if [[ -f "$PLIST" ]]; then
            if grep -q "ITSAppUsesNonExemptEncryption" "$PLIST"; then
              echo "✅ Export compliance key present in Info.plist"
              grep -A1 "ITSAppUsesNonExemptEncryption" "$PLIST"
            else
              echo "❌ Missing ITSAppUsesNonExemptEncryption in Info.plist"
              echo "This will cause App Store Connect to prompt for export compliance on every upload"
              exit 1
            fi
          else
            echo "⚠️ iOS project not found (ios/App/App/Info.plist missing)"
            echo "This is expected if Capacitor iOS hasn't been initialized yet"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Android Gradle Validation
  # ─────────────────────────────────────────────────────────────────────────────
  android-check:
    name: Android Config Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate Android config
        run: |
          GRADLE="android/app/build.gradle"
          if [[ -f "$GRADLE" ]]; then
            echo "✅ Android build.gradle found"

            # Check compileSdk
            if grep -q "compileSdk\s*3[4-9]" "$GRADLE" || grep -q "compileSdkVersion\s*3[4-9]" "$GRADLE"; then
              echo "✅ compileSdk is 34+"
            else
              echo "⚠️ compileSdk may be outdated"
            fi

            # Check minSdk
            if grep -q "minSdk\s*2[4-9]" "$GRADLE" || grep -q "minSdkVersion\s*2[4-9]" "$GRADLE"; then
              echo "✅ minSdk is 24+"
            else
              echo "⚠️ minSdk may be too low for WebGL"
            fi
          else
            echo "⚠️ Android project not found (android/app/build.gradle missing)"
            echo "This is expected if Capacitor Android hasn't been initialized yet"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Lighthouse Performance Audit
  # ─────────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
        continue-on-error: true

      - name: Run Lighthouse (fallback without config)
        if: failure()
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          urls: |
            http://localhost:3000/
          budgetPath: ''
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Playwright Automated E2E Visual Regression
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-visual-regression:
    name: E2E Visual Regression
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary Job (for branch protection rules)
  # ─────────────────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [deno-tests, build, capacitor-check, ios-compliance-check, android-check, lighthouse, e2e-visual-regression]
    if: always()

    steps:
      - name: Check all required jobs
        run: |
          FAILED=0
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build (typecheck + lint + test + audit + production build) failed"
            FAILED=1
          fi
          if [[ "${{ needs.e2e-visual-regression.result }}" != "success" ]]; then
            echo "❌ E2E Visual Regression tests failed"
            FAILED=1
          fi
          if [[ "${{ needs.deno-tests.result }}" != "success" ]]; then
            echo "❌ Deno tests failed"
            FAILED=1
          fi
          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
          echo "✅ All required CI checks passed"
          echo ""
          echo "📱 Mobile builds handled by Codemagic:"
          echo "   → iOS TestFlight: git tag ios-v1.0.0 && git push origin ios-v1.0.0"
          echo "   → Android Internal: git tag android-v1.0.0 && git push origin android-v1.0.0"
